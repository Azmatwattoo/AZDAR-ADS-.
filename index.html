
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AzDar Ads Watching</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#07111f;color:#f5f8ff;font-family:Arial}
header{text-align:center;padding:20px 5px}
h1{color:#00e5ff}
header p{color:#aab8cc}
.stats,.card{background:#101d30;border:1px solid #263b57;border-radius:15px;padding:15px}
.stats{max-width:1000px;margin:10px auto 22px}
#counter{font-size:23px;font-weight:bold;color:#00e5ff;margin-top:8px}
.progress-bg{height:12px;background:#26364c;border-radius:20px;overflow:hidden;margin-top:12px}
.progress{height:100%;width:0;background:linear-gradient(90deg,#a855f7,#00e5ff)}
.grid{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card h3{font-size:16px}
video{width:100%;height:165px;background:#000;border-radius:10px}
.status{font-size:13px;color:#aab8cc;margin-top:10px}
.done{color:#00e5a0}
footer{text-align:center;color:#8393aa;padding:25px}
</style>
</head>
<body>

<header>
<h1>⚡ AZDAR ADS WATCHING</h1>
<p>Watch Videos • Complete Daily Tasks</p>
</header>

<section class="stats">
<div>DAILY PROGRESS</div>
<div id="counter">0 / 10 Videos Completed</div>
<div class="progress-bg"><div class="progress" id="progress"></div></div>
<p id="message">Complete all 10 videos today.</p>
</section>

<main class="grid" id="videoGrid"></main>
<footer>© 2026 AzDar Web Studio</footer>

<script>
const videos=[
["Video 1 - Sample 15s","https://cdn.truefilesize.com/mp4/sample-60fps.mp4"],
["Video 2 - Sample Silent 15s","https://cdn.truefilesize.com/mp4/sample-silent.mp4"],
["Video 3 - Sample 15s","https://samplelib.com/lib/preview/mp4/sample-15s.mp4"],
["Video 4 - Sample 20s","https://samplelib.com/lib/preview/mp4/sample-20s.mp4"],
["Video 5 - Sample 30s","https://samplelib.com/lib/preview/mp4/sample-30s.mp4"],
["Video 6 - Flower 30s","https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"],
["Video 7 - Sintel Trailer","https://media.w3.org/2010/05/sintel/trailer.mp4"],
["Video 8 - Sample 30s","https://www.sample-videos.com/video321/mp4/720/big_buck_bunny_720p_1mb.mp4"],
["Video 9 - Sample MP4","https://www.samplefiles.online/files/sample.mp4"],
["Video 10 - Sample Video","https://www.learningcontainer.com/wp-content/uploads/2020/05/sample-mp4-file.mp4"]
];

const today=new Date().toLocaleDateString();
let saved;
try{saved=JSON.parse(localStorage.getItem("azdarProgress")||"null")}catch(e){saved=null}

if(!saved||saved.date!==today){
 saved={date:today,done:[]};
 localStorage.setItem("azdarProgress",JSON.stringify(saved));
}
if(!Array.isArray(saved.done))saved.done=[];

const grid=document.getElementById("videoGrid");

function update(){
 let total=saved.done.length;
 document.getElementById("counter").textContent=total+" / 10 Videos Completed";
 document.getElementById("progress").style.width=(total*10)+"%";
 document.getElementById("message").textContent=
 total===10?"All 10 videos completed!":(10-total)+" videos remaining.";
}

videos.forEach((item,index)=>{
 const card=document.createElement("section");
 card.className="card";

 const heading=document.createElement("h3");
 heading.textContent=item[0];

 const video=document.createElement("video");
 video.src=item[1];
 video.controls=true;
 video.preload="metadata";
 video.playsInline=true;

 const status=document.createElement("div");
 status.className="status";

 let watched=0,lastTime=null;
 let completed=saved.done.includes(index);

 function complete(){
  if(completed)return;
  completed=true;
  saved.done.push(index);
  localStorage.setItem("azdarProgress",JSON.stringify(saved));
  status.textContent="✓ Completed";
  status.className="status done";
  video.pause();
  update();
 }

 if(completed){
  status.textContent="✓ Completed";
  status.className="status done";
 }else{
  status.textContent="Watch 10 seconds continuously";
 }

 video.addEventListener("playing",()=>{
  lastTime=video.currentTime;
 });

 video.addEventListener("timeupdate",()=>{
  if(completed||video.paused)return;
  let now=video.currentTime;

  if(lastTime!==null){
   let gap=now-lastTime;
   if(gap>0&&gap<=1.5)watched+=gap;
   else if(gap>1.5)watched=0;
  }
  lastTime=now;

  if(watched>=10)complete();
  else status.textContent="Watched "+Math.floor(watched)+" / 10 seconds";
 });

 video.addEventListener("seeking",()=>{
  watched=0;
  lastTime=null;
  if(!completed)status.textContent="Watch 10 seconds again";
 });

 video.addEventListener("pause",()=>{
  lastTime=null;
  if(!completed){
   watched=0;
   status.textContent="Paused - watch 10 seconds";
  }
 });

 video.addEventListener("error",()=>{
  status.textContent="Video unavailable - try another video";
 });

 card.appendChild(heading);
 card.appendChild(video);
 card.appendChild(status);
 grid.appendChild(card);
});

update();
</script>
</body>
</html>
